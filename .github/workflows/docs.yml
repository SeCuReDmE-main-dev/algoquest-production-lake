name: docs-and-contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-docs.txt
      - run: python tools/scaffold_repo.py
      - run: python tools/generate_agent_exports.py
      - run: python tools/validate_lake.py
      - run: python -m unittest discover -s tests -v
      - run: mkdocs build --strict --clean
      - run: sphinx-build -W --keep-going -b html sphinx build/sphinx
      - run: cp -R build/sphinx site/reference
      - run: cp llms.txt site/llms.txt
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
